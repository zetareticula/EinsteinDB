[package]
name = "einsteindb_alloc"
version = "0.1.0"
edition = "2018"
authors = ["WHTCORPS INC"]
description = "Allocator abstraction for EinsteinDB (system default by default; optional jemalloc/tcmalloc/mimalloc)"
license = "Apache-2.0"
publish = false

[lib]
name = "einsteindb_alloc"
path = "src/lib.rs"

[features]
# Do not enable any allocator by default; use system allocator
# These features map to the conditional modules in src/
jemalloc = ["dep:jemallocator", "dep:jemalloc-ctl", "dep:jemalloc-sys", "dep:lazy_static"]
tcmalloc = []
mimalloc = []
mem-profiling = []

default = []

[dependencies]
libc = "0.2"
# Only pulled when feature = "jemalloc"
jemallocator = { version = "0.5", optional = true }
jemalloc-ctl = { version = "0.5", optional = true }
jemalloc-sys = { version = "0.5", optional = true }
lazy_static = { version = "1", optional = true }
