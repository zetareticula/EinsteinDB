[package]
name = "einsteindb-prod"
version = "0.0.1"
authors = ["karl whitford (karl@einst.ai), josh (slushie@gmail.com)"]
repository = "https://github.com/whtcorpsinc/einsteindb-prod"
license-file = "LICENSE"
description = """
A hybrid index embedded in-memory store that speaks AllegroSQL but treats tuples as atomic concurrent repeatable reads, thus serializable with bolt-on consistency"
"""

[dependencies]
bytes = "0.4"
chan = "0.1.21"
chan-signal = "0.3.1"
crc = "1.5.0"
crossbeam = "0.7"
either = "1.3"
error-chain = "0.12.1"
seahash = "4.1"
flate2 = "1.0.2"
lazy_static = "1.0"
log = "0.4"
memmap = "0.6"
num_cpus = "1.10.0"
rand = "0.5"
regex = "0.2"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
smallvec = "0.6.9"
thread_local = "0.3"
unicode_reader = "0.1.1"
num-traits = "0.2"
byteorder = "1"
crunchy = "0.2.2"

[dev-dependencies]
tempfile = "3.0.8"

# Optimized build profiles
[profile.release]
opt-level = 3        # Aggressive optimization
lto = true          # Link-time optimization
codegen-units = 1   # Slower build but better optimization
debug = false
panic = 'abort'     # Better optimization, smaller binary

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = true

[profile.dev]
opt-level = 1
debug = true

# Feature flags for advanced indexing and optimizations
[features]
default = ["docid-indexing"]
jemoalloc = ["jemallocator"]
simd-accel = []
docid-indexing = []

# Dependencies for advanced features
[dependencies.jemallocator]
version = "0.3.0"
optional = true

# SIMD acceleration
[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
packed_simd = { version = "0.3", features = ["into_bits"], optional = true }

[workspace]
members = [
    "berolinasql",
    "causet",
    "causetq",
    "core",
    "edb",
    "edb/LSH-Tree/batch_system",
    "einstein_db",
    "einstein_db_ctl",
    "einstein_ml",
    "einsteindb-server",
    "engine_test",
    "fdb_traits",
    "interlock",
    "sentry",
    "soliton",
    "soliton_panic",
    "violetabftstore",
    "zetareticulate",
]