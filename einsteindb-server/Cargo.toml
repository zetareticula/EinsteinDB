[package]
name = "einsteindb_server"
version = "0.1.0"
edition = "2021"
authors = ["einstein_db"]
description = "einstein_db server"

[dependencies]
clap = { version = "3.0", features = ["derive"] }
#einsteindb-prod = { path = ".." }
#allegro_poset = { path = "../allegro_poset" }
#causet = { path = "../causet" }
#causets = { path = "../causets" }
#einstein_db_ctl = { path = "../einstein_db_ctl" }
#berolinasql = { path = "../berolinasql" }
#fdb_traits = { path = "../fdb_traits" }
#einstein_ml = { path = "../einstein_ml" }
#soliton = { path = "../soliton" }

parking_lot = "0.12"
serde = "1.0"
serde_json = "1.0"
log = "0.4"
rusqlite = { version = "0.28", features = ["bundled"] }

